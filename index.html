<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121214">
  <title>Songwriter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>html, body { margin: 0; background: #121214; }</style>
</head>
<body>
  <div id="songwriter"></div>
  <script src="theory.js"></script>
  <script src="rhymes.js"></script>
  <script src="instruments.js"></script>
  <script src="config.js"></script>
  <script src="songs.js"></script>
  <script src="editor.js"></script>
  <script src="app.js"></script>
  <script>
    var app = SW.app.mount(document.getElementById('songwriter'));

    // Automatic updates, the same way the Setlist app does it: check for a new version every
    // minute and whenever the app is reopened; when one arrives, refresh (keeping your work).
    (function () {
      if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
      var CHECK_EVERY_MS = 60000;
      var hadVersion = !!navigator.serviceWorker.controller;   // first visit: nothing to refresh
      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadVersion || reloading) return;
        reloading = true;
        (function whenIdle() {
          if (app.isBusy()) return setTimeout(whenIdle, 500);  // never mid-drag
          app.saveSnapshot();
          location.reload();
        })();
      });
      navigator.serviceWorker.register('service-worker.js').then(function (reg) {
        function check() { reg.update().catch(function () {}); }
        setInterval(check, CHECK_EVERY_MS);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') check();
        });
      }).catch(function () {});
    })();
  </script>
</body>
</html>
